# ============================================================
# GenovaAI - Secrets Template
# ============================================================
# This file is a TEMPLATE. Do NOT commit actual secrets!
# The CI/CD pipeline will substitute {{VARIABLE}} placeholders
# with values from GitHub Secrets.
#
# Required GitHub Secrets:
# - FLASK_SECRET_KEY
# - POSTGRES_PASSWORD  
# - MONGO_PASSWORD
# - REDIS_PASSWORD
# - RABBITMQ_PASSWORD
# - GEMINI_API_KEY
# - LANGCHAIN_API_KEY (optional)
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: genovaai-secrets
  namespace: genovaai
type: Opaque
stringData:
  # Flask
  FLASK_SECRET_KEY: "{{FLASK_SECRET_KEY}}"
  
  # PostgreSQL
  POSTGRES_USER: "genovaai"
  POSTGRES_PASSWORD: "{{POSTGRES_PASSWORD}}"
  POSTGRES_DB: "genovaai"
  DATABASE_URL: "postgresql://genovaai:{{POSTGRES_PASSWORD}}@postgres:5432/genovaai"
  
  # MongoDB
  MONGO_INITDB_ROOT_USERNAME: "genovaai"
  MONGO_INITDB_ROOT_PASSWORD: "{{MONGO_PASSWORD}}"
  MONGO_INITDB_DATABASE: "genovaai"
  MONGO_URI: "mongodb://genovaai:{{MONGO_PASSWORD}}@mongodb:27017/genovaai?authSource=admin"
  MONGODB_URI: "mongodb://genovaai:{{MONGO_PASSWORD}}@mongodb:27017/genovaai?authSource=admin"
  
  # Redis
  REDIS_PASSWORD: "{{REDIS_PASSWORD}}"
  REDIS_URL: "redis://:{{REDIS_PASSWORD}}@redis:6379/0"
  
  # RabbitMQ
  RABBITMQ_DEFAULT_USER: "genovaai"
  RABBITMQ_DEFAULT_PASS: "{{RABBITMQ_PASSWORD}}"
  CELERY_BROKER_URL: "amqp://genovaai:{{RABBITMQ_PASSWORD}}@rabbitmq:5672//"
  CELERY_RESULT_BACKEND: "redis://:{{REDIS_PASSWORD}}@redis:6379/0"
  
  # Gemini API
  GEMINI_API_KEY: "{{GEMINI_API_KEY}}"
  
  # LangSmith (optional)
  LANGCHAIN_API_KEY: "{{LANGCHAIN_API_KEY}}"
  LANGCHAIN_PROJECT: "GenovaAI"
