# ============================================================
# GenovaAI - Kustomization Configuration
# ============================================================
# Secrets are auto-generated from .env file!
# Just put GEMINI_API_KEY in .env and run: kubectl apply -k kubernetes-manifests/
# ============================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: genovaai

# Auto-generate secrets from .env file
secretGenerator:
  - name: genovaai-secrets
    envs:
      - k8s.env
    options:
      disableNameSuffixHash: true

# Resources in order of dependency
resources:
  # 1. Namespace (must be first)
  - namespace.yaml
  
  # 2. ConfigMaps (non-sensitive config)
  - configmap.yaml
  
  # 3. Database StatefulSets
  - postgres.yaml
  - mongodb.yaml
  - redis.yaml
  - rabbitmq.yaml
  
  # 4. Application Deployments
  - genovaai.yaml
  - celery-worker.yaml
  - celery-beat.yaml
  - flower.yaml
  
  # 5. Monitoring Stack
  - prometheus.yaml
  - grafana.yaml
  
  # 6. Nginx Ingress
  - nginx.yaml

# Note: commonLabels removed to avoid selector immutability issues
# Labels are defined directly in each resource file

# Common annotations
commonAnnotations:
  app.kubernetes.io/version: "1.0.0"
