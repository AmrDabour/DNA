# ============================================================
# Celery Worker Deployment
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  namespace: genovaai
  labels:
    app: genovaai
    component: celery-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: genovaai
      component: celery-worker
  template:
    metadata:
      labels:
        app: genovaai
        component: celery-worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9808"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      initContainers:
        - name: wait-for-rabbitmq
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z rabbitmq 5672; do echo waiting for rabbitmq; sleep 2; done;']
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
        - name: wait-for-redis
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z redis 6379; do echo waiting for redis; sleep 2; done;']
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
      containers:
      - name: celery-worker
        image: amrdabour/genovaai:v1.2
        imagePullPolicy: IfNotPresent
        command:
        - celery
        - -A
        - celery_app
        - worker
        - --loglevel=INFO
        - --concurrency=4
        envFrom:
        - configMapRef:
            name: genovaai-config
        - secretRef:
            name: genovaai-secrets
        volumeMounts:
        - name: uploads
          mountPath: /app/uploads
        - name: results
          mountPath: /app/result
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
            ephemeral-storage: "512Mi"
          limits:
            memory: "1Gi"
            cpu: "500m"
            ephemeral-storage: "2Gi"
        readinessProbe:
          exec:
            command:
            - celery
            - -A
            - celery_app
            - inspect
            - ping
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
        livenessProbe:
          exec:
            command:
            - celery
            - -A
            - celery_app
            - inspect
            - ping
          initialDelaySeconds: 60
          periodSeconds: 60
          timeoutSeconds: 10
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: genovaai-uploads-pvc
        - name: results
          persistentVolumeClaim:
            claimName: genovaai-results-pvc
