# ============================================================
# Flower (Celery Monitoring) Deployment
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flower
  namespace: genovaai
  labels:
    app: genovaai
    component: flower
spec:
  replicas: 1
  selector:
    matchLabels:
      app: genovaai
      component: flower
  template:
    metadata:
      labels:
        app: genovaai
        component: flower
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      initContainers:
        - name: wait-for-rabbitmq
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z rabbitmq 5672; do echo waiting for rabbitmq; sleep 2; done;']
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
      containers:
        - name: flower
          image: amrdabour/genovaai:latest
          imagePullPolicy: Always
          command:
            - celery
            - -A
            - celery_app
            - flower
            - --port=5555
          ports:
            - containerPort: 5555
              name: flower
          envFrom:
            - configMapRef:
                name: genovaai-config
            - secretRef:
                name: genovaai-secrets
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
              ephemeral-storage: "256Mi"
            limits:
              memory: "256Mi"
              cpu: "500m"
              ephemeral-storage: "512Mi"
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 5555
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 5555
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: flower
  namespace: genovaai
  labels:
    app: genovaai
    component: flower
spec:
  type: ClusterIP
  ports:
    - port: 5555
      targetPort: 5555
      name: flower
  selector:
    app: genovaai
    component: flower
