# ============================================================
# GenovaAI - Secrets
# ============================================================
# NOTE: In production, use sealed-secrets or external-secrets
# These are base64 encoded placeholder values - CHANGE BEFORE DEPLOYMENT
apiVersion: v1
kind: Secret
metadata:
  name: genovaai-secrets
  namespace: genovaai
type: Opaque
stringData:
  # Flask
  FLASK_SECRET_KEY: "change-me-to-a-secure-random-string-in-production"
  
  # PostgreSQL
  POSTGRES_USER: "genovaai"
  POSTGRES_PASSWORD: "change-me-postgres-password"
  POSTGRES_DB: "genovaai"
  DATABASE_URL: "postgresql://genovaai:change-me-postgres-password@postgres:5432/genovaai"
  
  # MongoDB
  MONGO_INITDB_ROOT_USERNAME: "genovaai"
  MONGO_INITDB_ROOT_PASSWORD: "change-me-mongo-password"
  MONGO_INITDB_DATABASE: "genovaai"
  MONGODB_URI: "mongodb://genovaai:change-me-mongo-password@mongodb:27017/genovaai?authSource=admin"
  
  # Redis
  REDIS_PASSWORD: "change-me-redis-password"
  REDIS_URL: "redis://:change-me-redis-password@redis:6379/0"
  
  # RabbitMQ
  RABBITMQ_DEFAULT_USER: "genovaai"
  RABBITMQ_DEFAULT_PASS: "change-me-rabbitmq-password"
  CELERY_BROKER_URL: "amqp://genovaai:change-me-rabbitmq-password@rabbitmq:5672//"
  CELERY_RESULT_BACKEND: "redis://:change-me-redis-password@redis:6379/0"
  
  # Gemini API
  GEMINI_API_KEY: "add secret here"
  
  # LangSmith (optional)
  LANGCHAIN_API_KEY: ""
  LANGCHAIN_PROJECT: "GenovaAI"
---
# ============================================================
# GenovaAI - ConfigMaps
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: genovaai-config
  namespace: genovaai
data:
  # Flask Configuration
  FLASK_APP: "app.py"
  FLASK_ENV: "production"
  FLASK_DEBUG: "0"
  
  # Celery Configuration
  CELERY_WORKER_CONCURRENCY: "4"
  CELERY_WORKER_LOGLEVEL: "INFO"
  
  # Application Configuration
  UPLOAD_FOLDER: "/app/uploads"
  RESULT_FOLDER: "/app/result"
  MAX_CONTENT_LENGTH: "52428800"
  
  # LangSmith Configuration
  LANGCHAIN_TRACING_V2: "false"
  LANGCHAIN_ENDPOINT: "https://api.smith.langchain.com"
