# ============================================================
# GenovaAI - Secrets
# ============================================================
# NOTE: In production, use sealed-secrets or external-secrets
# These are base64 encoded placeholder values - CHANGE BEFORE DEPLOYMENT
apiVersion: v1
kind: Secret
metadata:
  name: genovaai-secrets
  namespace: genovaai
type: Opaque
stringData:
  # Flask
  FLASK_SECRET_KEY: "admin123"
  
  # PostgreSQL
  POSTGRES_USER: "genovaai"
  POSTGRES_PASSWORD: "admin123"
  POSTGRES_DB: "genovaai"
  DATABASE_URL: "postgresql://genovaai:admin123@postgres:5432/genovaai"
  
  # MongoDB - No auth for local development
  MONGO_INITDB_ROOT_USERNAME: "genovaai"
  MONGO_INITDB_ROOT_PASSWORD: "change-me-mongo-password"
  MONGO_INITDB_DATABASE: "genovaai"
  MONGO_URI: "mongodb://mongodb:27017/genovaai"
  MONGODB_URI: "mongodb://mongodb:27017/genovaai"
  
  # Redis
  REDIS_PASSWORD: "admin123"
  REDIS_URL: "redis://:admin123@redis:6379/0"
  
  # RabbitMQ
  RABBITMQ_DEFAULT_USER: "genovaai"
  RABBITMQ_DEFAULT_PASS: "admin123"
  CELERY_BROKER_URL: "amqp://genovaai:admin123@rabbitmq:5672//"
  CELERY_RESULT_BACKEND: "redis://:admin123@redis:6379/0"
  
  # Gemini API
  GEMINI_API_KEY: "AIzaSyAyFQ0G4cSqtKh5xhmFpULAHNXjNX4F8qg"
  
  # LangSmith (optional)
  LANGCHAIN_API_KEY: ""
  LANGCHAIN_PROJECT: "GenovaAI"
---
# ============================================================
# GenovaAI - ConfigMaps
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: genovaai-config
  namespace: genovaai
data:
  # Flask Configuration
  FLASK_APP: "app.py"
  FLASK_ENV: "production"
  FLASK_DEBUG: "0"
  
  # Database Hosts (Kubernetes service names)
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  MONGO_HOST: "mongodb"
  MONGO_PORT: "27017"
  MONGO_DB: "genovaai"
  MONGO_USER: ""
  MONGO_PASSWORD: ""
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  RABBITMQ_HOST: "rabbitmq"
  RABBITMQ_PORT: "5672"
  
  # Celery Configuration
  CELERY_ENABLED: "true"
  CELERY_WORKER_CONCURRENCY: "4"
  CELERY_WORKER_LOGLEVEL: "INFO"
  
  # Application Configuration
  UPLOAD_FOLDER: "/app/uploads"
  RESULT_FOLDER: "/app/result"
  MAX_CONTENT_LENGTH: "52428800"
  
  # LangSmith Configuration
  LANGCHAIN_TRACING_V2: "false"
  LANGCHAIN_ENDPOINT: "https://api.smith.langchain.com"
