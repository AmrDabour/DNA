# ============================================================
# GenovaAI - Build and Push Docker Images
# ============================================================
name: Build and Push Docker Image

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: amrdabour/genovaai

jobs:
  build-and-push:
    name: Build and Push GenovaAI
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}

      - name: Update Kubernetes manifests
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          
          # Update image tag in deployments
          sed -i "s|image: amrdabour/genovaai:.*|image: amrdabour/genovaai:main-$SHORT_SHA|g" kubernetes-manifests/genovaai.yaml
          sed -i "s|image: amrdabour/genovaai:.*|image: amrdabour/genovaai:main-$SHORT_SHA|g" kubernetes-manifests/celery-worker.yaml
          sed -i "s|image: amrdabour/genovaai:.*|image: amrdabour/genovaai:main-$SHORT_SHA|g" kubernetes-manifests/celery-beat.yaml
          sed -i "s|image: amrdabour/genovaai:.*|image: amrdabour/genovaai:main-$SHORT_SHA|g" kubernetes-manifests/flower.yaml

      - name: Commit updated manifests
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "ci: update image tag to main-${{ github.sha }}"
          file_pattern: 'kubernetes-manifests/*.yaml'
