# ============================================================
# GenovaAI - Dependency Updates & Maintenance
# ============================================================
# Automated maintenance tasks:
# - Dependency updates with Dependabot
# - Automated PR creation for updates
# - Scheduled security audits
# - Docker base image updates
# - Kubernetes manifest updates
# ============================================================
name: Dependency Updates

on:
  schedule:
    # Run weekly on Mondays at 6 AM UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      update_type:
        description: 'Type of update'
        required: true
        type: choice
        options:
          - all
          - python
          - docker
          - github-actions

jobs:
  # ============================================================
  # Python Dependency Updates
  # ============================================================
  python-updates:
    name: Python Dependencies
    runs-on: ubuntu-latest
    if: inputs.update_type == 'all' || inputs.update_type == 'python' || github.event_name == 'schedule'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tools
        run: |
          pip install pip-tools safety

      - name: Check for outdated packages
        run: |
          pip install -r requirements.txt
          pip list --outdated --format=json > outdated.json
          
          echo "## Outdated Python Packages" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat outdated.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Run security audit
        run: |
          safety check -r requirements.txt --full-report
        continue-on-error: true

      - name: Update requirements (minor versions)
        run: |
          # Create updated requirements
          pip install pip-upgrader
          pip-upgrade requirements.txt --skip-package-installation -p minor
        continue-on-error: true

      - name: Create PR for updates
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(deps): update Python dependencies'
          title: '🔄 Update Python Dependencies'
          body: |
            ## Automated Dependency Update
            
            This PR updates Python dependencies to their latest compatible versions.
            
            ### Changes
            - Updated packages listed in requirements.txt
            
            ### Checklist
            - [ ] Review updated packages
            - [ ] Run tests locally
            - [ ] Check for breaking changes
          branch: deps/python-updates
          delete-branch: true
          labels: |
            dependencies
            automated
        continue-on-error: true

  # ============================================================
  # Docker Base Image Updates
  # ============================================================
  docker-updates:
    name: Docker Base Images
    runs-on: ubuntu-latest
    if: inputs.update_type == 'all' || inputs.update_type == 'docker' || github.event_name == 'schedule'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for Docker base image updates
        run: |
          echo "## Docker Base Image Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Check Python base image
          CURRENT_PYTHON=$(grep "FROM python" Dockerfile | head -1 | cut -d: -f2 | cut -d' ' -f1)
          echo "Current Python image: python:$CURRENT_PYTHON" >> $GITHUB_STEP_SUMMARY
          
          # Check available tags
          curl -s "https://hub.docker.com/v2/repositories/library/python/tags?page_size=10&name=3.11-slim" | jq -r '.results[].name' >> $GITHUB_STEP_SUMMARY

      - name: Scan current base image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'python:3.11-slim'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  # ============================================================
  # GitHub Actions Updates
  # ============================================================
  actions-updates:
    name: GitHub Actions
    runs-on: ubuntu-latest
    if: inputs.update_type == 'all' || inputs.update_type == 'github-actions' || github.event_name == 'schedule'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for action updates
        run: |
          echo "## GitHub Actions Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # List all actions used
          grep -r "uses:" .github/workflows/ | grep -v "#" | sort -u >> $GITHUB_STEP_SUMMARY

      - name: Update actions to latest
        uses: renovatebot/github-action@v40.1.0
        with:
          configurationFile: .github/renovate.json
          token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  # ============================================================
  # Kubernetes Manifest Updates
  # ============================================================
  k8s-updates:
    name: Kubernetes Manifests
    runs-on: ubuntu-latest
    if: inputs.update_type == 'all' || github.event_name == 'schedule'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for K8s image updates
        run: |
          echo "## Kubernetes Image Versions" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # List all images in manifests
          grep -r "image:" kubernetes-manifests/ | grep -v "#" >> $GITHUB_STEP_SUMMARY

      - name: Check for deprecated APIs
        run: |
          # Install kubent (Kubernetes No Troubles)
          curl -sSL https://git.io/install-kubent | sh
          
          # Check for deprecated APIs
          ./kubent -f kubernetes-manifests/ || true
        continue-on-error: true

  # ============================================================
  # Summary Report
  # ============================================================
  summary:
    name: Update Summary
    runs-on: ubuntu-latest
    needs: [python-updates, docker-updates, actions-updates, k8s-updates]
    if: always()
    
    steps:
      - name: Generate summary
        run: |
          echo "## 📦 Dependency Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Python | ${{ needs.python-updates.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker | ${{ needs.docker-updates.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| GitHub Actions | ${{ needs.actions-updates.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Kubernetes | ${{ needs.k8s-updates.result }} |" >> $GITHUB_STEP_SUMMARY
