# ============================================================
# Kustomization for GenovaAI Kubernetes Deployment
# ============================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: genovaai-kustomization

namespace: genovaai

# Common labels applied to all resources
commonLabels:
  app.kubernetes.io/name: genovaai
  app.kubernetes.io/instance: production
  app.kubernetes.io/version: "1.0.0"
  app.kubernetes.io/managed-by: kustomize

# Resources to include
resources:
  - namespace.yaml
  - configmap.yaml
  - secrets.yaml
  - postgres/pvc.yaml
  - postgres/statefulset.yaml
  - postgres/service.yaml
  - app/deployment.yaml
  - app/service.yaml
  - app/hpa.yaml
  - ingress.yaml

# Images configuration (for easy version updates)
images:
  - name: amrdabour/genovaai
    newTag: latest
  - name: postgres
    newTag: "15-alpine"

# Config transformers
configMapGenerator: []

# Secret transformers (for generating secrets from literals or files)
# secretGenerator:
#   - name: genovaai-secrets
#     literals:
#       - FLASK_SECRET_KEY=your-key
#       - POSTGRES_PASSWORD=your-password

# Patches for environment-specific modifications
# patchesStrategicMerge:
#   - patch-production.yaml
