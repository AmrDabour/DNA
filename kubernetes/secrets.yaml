# ============================================================
# GenovaAI Secrets - Sensitive configuration
# NOTE: In production, use external secret management
# (e.g., AWS Secrets Manager, HashiCorp Vault, K8s External Secrets)
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: genovaai-secrets
  namespace: genovaai
  labels:
    app: genovaai
type: Opaque
stringData:
  # Flask Secret Key (generate a secure random key in production)
  FLASK_SECRET_KEY: "your-secure-flask-secret-key-change-in-production"
  
  # PostgreSQL Credentials
  POSTGRES_USER: "genovaai_user"
  POSTGRES_PASSWORD: "change-this-secure-password-in-production"
  
  # Admin Password
  ADMIN_PASSWORD: "change-this-admin-password-in-production"
  
  # Gemini API Key (optional)
  GEMINI_API_KEY: ""
  
  # Full Database URL (constructed from above)
  DATABASE_URL: "postgresql://genovaai_user:change-this-secure-password-in-production@postgres-service:5432/genovaai"
