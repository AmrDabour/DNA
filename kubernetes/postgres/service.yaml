# ============================================================
# PostgreSQL Service - ClusterIP for internal access
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: genovaai
  labels:
    app: postgres
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
  selector:
    app: postgres
---
# ============================================================
# PostgreSQL Headless Service (for StatefulSet)
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  namespace: genovaai
  labels:
    app: postgres
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    app: postgres
