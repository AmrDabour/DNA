# ============================================================
# GenovaAI Application Service
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: genovaai-service
  namespace: genovaai
  labels:
    app: genovaai
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 5001
      protocol: TCP
      name: http
  selector:
    app: genovaai
---
# ============================================================
# GenovaAI NodePort Service (for external access without ingress)
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: genovaai-nodeport
  namespace: genovaai
  labels:
    app: genovaai
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 5001
      nodePort: 30501
      protocol: TCP
      name: http
  selector:
    app: genovaai
