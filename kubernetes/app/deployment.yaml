# ============================================================
# GenovaAI Application Deployment
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: genovaai
  namespace: genovaai
  labels:
    app: genovaai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: genovaai
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: genovaai
    spec:
      serviceAccountName: genovaai-sa
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
      initContainers:
        # Wait for PostgreSQL to be ready
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              until nc -z postgres-service 5432; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
              echo "PostgreSQL is ready!"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      containers:
        - name: genovaai
          image: amrdabour/genovaai:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5001
              name: http
          env:
            # From ConfigMap
            - name: FLASK_ENV
              valueFrom:
                configMapKeyRef:
                  name: genovaai-config
                  key: FLASK_ENV
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: genovaai-config
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: genovaai-config
                  key: POSTGRES_PORT
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: genovaai-config
                  key: POSTGRES_DB
            - name: DB_POOL_SIZE
              valueFrom:
                configMapKeyRef:
                  name: genovaai-config
                  key: DB_POOL_SIZE
            - name: DB_MAX_OVERFLOW
              valueFrom:
                configMapKeyRef:
                  name: genovaai-config
                  key: DB_MAX_OVERFLOW
            - name: DB_POOL_TIMEOUT
              valueFrom:
                configMapKeyRef:
                  name: genovaai-config
                  key: DB_POOL_TIMEOUT
            - name: ADMIN_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: genovaai-config
                  key: ADMIN_USERNAME
            - name: ADMIN_EMAIL
              valueFrom:
                configMapKeyRef:
                  name: genovaai-config
                  key: ADMIN_EMAIL
            # From Secrets
            - name: FLASK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: genovaai-secrets
                  key: FLASK_SECRET_KEY
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: genovaai-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: genovaai-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: genovaai-secrets
                  key: DATABASE_URL
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: genovaai-secrets
                  key: ADMIN_PASSWORD
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: genovaai-secrets
                  key: GEMINI_API_KEY
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
            - name: results
              mountPath: /app/result
            - name: plots
              mountPath: /app/plots
            - name: visualizations
              mountPath: /app/visualizations
          livenessProbe:
            httpGet:
              path: /
              port: 5001
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 5001
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: genovaai-uploads-pvc
        - name: results
          persistentVolumeClaim:
            claimName: genovaai-results-pvc
        - name: plots
          emptyDir: {}
        - name: visualizations
          emptyDir: {}
---
# ============================================================
# GenovaAI Service Account
# ============================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: genovaai-sa
  namespace: genovaai
  labels:
    app: genovaai
---
# ============================================================
# GenovaAI PVCs
# ============================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: genovaai-uploads-pvc
  namespace: genovaai
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 50Gi
  storageClassName: standard
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: genovaai-results-pvc
  namespace: genovaai
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 20Gi
  storageClassName: standard
