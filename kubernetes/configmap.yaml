# ============================================================
# GenovaAI ConfigMap - Non-sensitive configuration
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: genovaai-config
  namespace: genovaai
  labels:
    app: genovaai
data:
  # Flask Configuration
  FLASK_ENV: "production"
  
  # PostgreSQL Configuration
  POSTGRES_HOST: "postgres-service"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "genovaai"
  
  # Connection Pool Settings
  DB_POOL_SIZE: "10"
  DB_MAX_OVERFLOW: "20"
  DB_POOL_TIMEOUT: "30"
  
  # Application Settings
  UPLOAD_DIR: "/app/uploads"
  MAX_CONTENT_LENGTH: "52428800"  # 50MB
  
  # Admin Configuration (username only - password in secret)
  ADMIN_USERNAME: "admin"
  ADMIN_EMAIL: "admin@genovaai.com"
