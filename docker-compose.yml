  #     - redis-data:/data
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   networks:
  #     - genovaai-network

  # ============================================================
  # PgAdmin (Optional - for database management)
  # ============================================================
  # pgadmin:
  #   image: dpage/pgadmin4:latest
  #   container_name: genovaai-pgadmin
  #   restart: unless-stopped
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@genovaai.com}
  #     PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
  #   ports:
  #     - "5050:80"
  #   volumes:
  #     - pgadmin-data:/var/lib/pgadmin
  #   depends_on:
  #     - postgres
  #   networks:
  #     - genovaai-network

# ============================================================
# Named Volumes for Data Persistence
# ============================================================
volumes:
  postgres-data:
    driver: local
  postgres-backups:
    driver: local
  mongodb-data:
    driver: local
  mongodb-config:
    driver: local
  genovaai-uploads:
    driver: local
  genovaai-results:
    driver: local
  genovaai-plots:
    driver: local
  genovaai-visualizations:
    driver: local
  # redis-data:
  #   driver: local
  # pgadmin-data:
  #   driver: local

# ============================================================
# Network Configuration
# ============================================================
networks:
  genovaai-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

