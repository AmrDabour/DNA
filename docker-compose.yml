# ============================================================
# GenovaAI - Docker Compose Configuration
# Production-Ready with PostgreSQL 15 Alpine
# ============================================================
version: '3.8'

services:
  # ============================================================
  # PostgreSQL Database Service
  # ============================================================
  postgres:
    image: postgres:15-alpine
    container_name: genovaai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-genovaai}
      POSTGRES_USER: ${POSTGRES_USER:-genovaai_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-genovaai_secure_password_2024}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init_scripts:/docker-entrypoint-initdb.d:ro
      - postgres-backups:/backups
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-genovaai_user} -d ${POSTGRES_DB:-genovaai}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - genovaai-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # ============================================================
  # MongoDB Database Service
  # ============================================================
  mongodb:
    image: mongo:7.0
    container_name: genovaai-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-genovaai_mongo_user}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-genovaai_mongo_password_2024}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-genovaai}
    volumes:
      - mongodb-data:/data/db
      - mongodb-config:/data/configdb
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - genovaai-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # ============================================================
  # Main Flask Application
  # ============================================================
  genovaai:
    build:
      context: .
      dockerfile: Dockerfile
    image: amrdabour/genovaai:${TAG:-latest}
    container_name: genovaai-app
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      # Flask Configuration
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-genetic_prediction_app_secret_key}
      - FLASK_ENV=${FLASK_ENV:-development}
      - FLASK_DEBUG=${FLASK_DEBUG:-1}
      
      # PostgreSQL Database Configuration
      - DATABASE_URL=postgresql://${POSTGRES_USER:-genovaai_user}:${POSTGRES_PASSWORD:-genovaai_secure_password_2024}@postgres:5432/${POSTGRES_DB:-genovaai}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-genovaai}
      - POSTGRES_USER=${POSTGRES_USER:-genovaai_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-genovaai_secure_password_2024}
      
      # MongoDB Configuration
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_DB=${MONGO_DB:-genovaai}
      - MONGO_USER=${MONGO_USER:-genovaai_mongo_user}
      - MONGO_PASSWORD=${MONGO_PASSWORD:-genovaai_mongo_password_2024}
      
      # Connection Pool Settings
      - DB_POOL_SIZE=${DB_POOL_SIZE:-10}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-20}
      - DB_POOL_TIMEOUT=${DB_POOL_TIMEOUT:-30}
      
      # API Keys
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      
      # Admin Configuration
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@genovaai.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
    volumes:
      # Development: Mount source code for live reload (comment out for production)
      - ./routes:/app/routes:ro
      - ./templates:/app/templates:ro
      - ./static:/app/static:ro
      - ./services:/app/services:ro
      - ./utils:/app/utils:ro
      - ./config:/app/config:ro
      - ./new_model:/app/new_model:ro
      - ./agent:/app/agent:ro
      - ./scripts:/app/scripts:ro
      # Persist uploads and results
      - genovaai-uploads:/app/uploads
      - genovaai-results:/app/result
      - genovaai-plots:/app/plots
      - genovaai-visualizations:/app/visualizations
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - genovaai-network
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # ============================================================
  # Redis Cache Service (Optional - Uncomment when needed)
  # ============================================================
  # redis:
  #   image: redis:7-alpine
  #   container_name: genovaai-redis
